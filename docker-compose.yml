version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=n8n_user
      - POSTGRES_PASSWORD=n8n_password_change_me 
      - POSTGRES_DB=n8n_database
    volumes:
      - db_storage:/var/lib/postgresql/data
    networks:
      - proxy-network

  n8n:
    image: n8nio/n8n:latest
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_database
      - DB_POSTGRESDB_USER=n8n_user
      - DB_POSTGRESDB_PASSWORD=n8n_password_change_me
      - N8N_TIMEZONE=Asia/Karachi
      - N8N_PORT=5678
      - N8N_EDITOR_BASE_URL=https://n8n.cristalinawater.com/
      - WEBHOOK_URL=https://n8n.cristalinawater.com/
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
    networks:
      - proxy-network
    depends_on:
      - db

networks:
  proxy-network:
    external: true

volumes:
  db_storage:
    external: true
    name: n8n-automation_db_storage
  n8n_storage:
    external: true
    name: n8n-automation_n8n_storage