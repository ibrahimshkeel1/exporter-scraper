# --------------------------------------------------
# SIGNALS
# --------------------------------------------------
signals:
  cluster: generic_b2b
  search_intent: generic_b2b

  signal_catalog:
    - name: active-growth-intent
      why_now: "Recent growth announcements often map to near-term buying intent."
      confidence: 0.70
      query_templates:
        - '{industry} {market} expansion contact'
        - '{industry} {market} project request proposal'
