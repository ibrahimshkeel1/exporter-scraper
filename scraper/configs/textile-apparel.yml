# ============================================================
# Specialist Config: Textile & Apparel Importers
# ============================================================
# Extracted from signal_map.py, discovery.py, scoring.py, enrichment.py
# This is the A+ config — DO NOT degrade its performance.
# Tuning iterations should only ADD, never remove.

slug: textile-apparel
display_name: "Textile & Apparel Importers"
version: 4
quality_tier: "A+"

# --------------------------------------------------
# ROUTER CLASSIFICATION
# Keywords that trigger this config
# --------------------------------------------------
triggers:
  keywords:
    - activewear
    - apparel
    - boutique
    - clothing
    - denim
    - fabric
    - fashion
    - garment
    - jeans
    - "private label"
    - "private label clothing"
    - sportswear
    - streetwear
    - textile
    - towel
    - leather
    - home textile
    - knitwear
    - hosiery
    - woven
    - uniform
    - shirt
    - dress
    - bags
    - lingerie
    - swimwear
    - footwear
    - accessories
    - shoes

# --------------------------------------------------
# DISCOVERY
# --------------------------------------------------
discovery:

  # --- Product Seed Terms ---
  # Trimmed to specific buyer-facing categories (removed "fabric","fashion","clothing","textile"
  # which are too broad and return mostly manufacturer/supplier results).
  product_seeds:
    - denim
    - jeans
    - activewear
    - sportswear
    - streetwear
    - home textile
    - towel
    - leather
    - garment
    - apparel

  # --- Search Query Templates ---
  # Only first 8 are executed (_search_sources caps at queries[:8] for apparel).
  # Ordered by signal strength: procurement/sourcing > quoted exact-match > broad.
  search_engines:
    - bing
    - yahoo

  search_engine_runtime:
    bing:
      max_requests: 16
      min_delay_seconds: 9
      cooldown_seconds: 75
      failure_threshold: 3
    yahoo:
      max_requests: 14
      min_delay_seconds: 8
      cooldown_seconds: 55
      failure_threshold: 3

  # Textile tuning should start from structured textile directories, not legacy generic apparel seeds.
  seed_urls_enabled: false

  # {base} = product seed, {market} = target market
  search_queries:
    # TIER 1: Highest buyer signal — brands/retailers actively looking for manufacturers
    - '{base} private label clothing brand sourcing "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '{base} procurement vendor application retailer "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '{base} supplier application "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '{base} vendor portal "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    # TIER 2: Quoted exact-match — high precision, less noise
    - '"{base} importer" "{market}" "contact" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '"{base} wholesaler" "{market}" "contact" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '"{base} distributor" "{market}" "contact" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '"{base} retailer" "vendor application" "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    # TIER 3: Broader queries (executed only if budget remains after tier 1-2)
    - '{base} importer wholesaler distributor "{market}" contact -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '{base} wholesale buyer retailer "{market}" contact email -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '{base} boutique retailer wholesale distributor "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '{base} wholesale account "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '{base} trade account "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '{base} stockist "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '{base} line sheet "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '{base} buying office "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '{base} sourcing manager "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '"{base} brand" "wholesale" "contact" "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '"{base} brand" "supplier portal" "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    - '"{base} brand" "buying office" "{market}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'

  # --- Per-Region Extra Search Queries ---
  region_extra_queries:
    europe:
      - '{base} importer wholesaler distributor "{country}" contact -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
      - '{base} retailer "supplier portal" "{country}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
      - '{base} brand "vendor application" "{country}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
    international:
      - '{base} importer wholesaler distributor "{country}" contact -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'
      - '{base} retailer "supplier portal" "{country}" -Pakistan -India -Bangladesh -China -manufacturer -factory -exporter'

  # --- Noise Exclusions appended to all queries ---
  noise_exclusion_suffixes:
    - -dictionary
    - -definition
    - -wikipedia
    - -wiktionary
    - -reddit
    - -youtube

  # --- Supplier Country Exclusions (appended to apparel queries) ---
  supplier_country_exclusions:
    - "-Pakistan"
    - "-India"
    - "-Bangladesh"
    - "-China"
    - "-manufacturer"
    - "-factory"
    - "-exporter"

