# --------------------------------------------------
# SIGNALS (from signal_map.py manufacturing_expansion cluster)
# --------------------------------------------------
signals:
  cluster: textile_buyer_sourcing
  search_intent: textile_buyer_sourcing

  signal_catalog:
    - name: importer-buyer-evidence
      why_now: "Importer and distribution pages expose active buyer-side textile demand."
      confidence: 0.90
      query_templates:
        - '{industry} "{market}" importer contact'
        - '{industry} "{market}" wholesale distributor contact'

    - name: private-label-sourcing
      why_now: "Private-label brands and sourcing teams are likely manufacturer-buyers."
      confidence: 0.88
      query_templates:
        - '{industry} private label brand sourcing "{market}"'
        - '{industry} private label program "{market}" contact'

    - name: vendor-procurement-pages
      why_now: "Vendor application and supplier portal pages reveal buyer-side onboarding."
      confidence: 0.85
      query_templates:
        - '{industry} vendor application retailer "{market}"'
        - '{industry} supplier portal procurement "{market}"'

    - name: trade-show-buyers
      why_now: "Trade show brand lists surface companies actively buying and selling textile categories."
      confidence: 0.82
      query_templates:
        - '{industry} MAGIC Las Vegas brand list'
        - '{industry} Texworld NYC exhibitor list'

    - name: wholesale-account-pages
      why_now: "Wholesale and trade-account pages identify contactable buyers with category fit."
      confidence: 0.78
      query_templates:
        - '{industry} wholesale account "{market}" contact'
        - '{industry} trade account "{market}" contact'
